<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music&Cia</title>
    <link rel="stylesheet" href="css/musi.css">
</head>
<body>
    <header> 
        <h1>Equipamentos</h1>
    </header>

    <div class="container">

        <div class="card">
            <div class="produto">
                <img src="violino.img" alt="violino" width="300px">
                <h2>violino</h2>
                <p class="descricao">Ideal para mulheres e homens</p>
                <p class="preco">R$ 900,00</p>
                <button>Comprar</button>
            </div>
        </div>

        <div class="card">
            <div class="produto">
                <img src="piano.img" alt="Piano">
                <h2>Piano</h2>
                <p class="descricao">Ideal para mulheres e homens</p>
                <p class="preco">R$ 10.000000</p>
                <button>Comprar</button>
            </div>
        </div>

        <div class="card">
            <div class="produto">
                <img src="violao.img" alt="violao">
                <h2>violao</h2>
                <p class="descricao">Ideal para mulheres e homens</p>
                <p class="preco">R$ 1.0000</p>
                <button>Comprar</button>
            </div>
        </div>

        <div class="card">
            <div class="produto">
                <img src="bateria.img" alt="bateria">
                <h2>bateria</h2>
                <p class="descricao">Ideal para mulheres e homens</p>
                <p class="preco">R$ 2.5000</p>
                <button>Comprar</button>
            </div>
        </div>

    </div> 

</body>
</html>
